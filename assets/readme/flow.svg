<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="How Bodhini works: scan, read, verify, save, fill" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How Bodhini works</title>
  <style>
    .t { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
    .rail { stroke-dasharray: 8 10; animation: flow 1.6s linear infinite; }
    .node { animation: pulse 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; } .n4 { animation-delay: 3s; } .n5 { animation-delay: 4s; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%,70%,100% { transform: scale(1); } 15% { transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .rail, .node { animation: none; } }
  </style>
  <rect width="1200" height="230" rx="28" fill="#F6F4F1"/>
  <line class="rail" x1="120" y1="86" x2="1080" y2="86" stroke="#1E6148" stroke-width="3" opacity="0.5"/>

  <g class="node"><circle cx="120" cy="86" r="42" fill="#1E6148"/>
    <path d="M102 74V68H108M132 68H138V74M138 98V104H132M108 104H102V98" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="110" y="80" width="20" height="12" rx="3" fill="#FFFFFF" opacity="0.9"/></g>
  <g class="node n2"><circle cx="360" cy="86" r="42" fill="#1E6148"/>
    <rect x="338" y="68" width="44" height="6" rx="3" fill="#FFFFFF"/><rect x="338" y="82" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.8"/><rect x="338" y="96" width="38" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/></g>
  <g class="node n3"><circle cx="600" cy="86" r="42" fill="#1E6148"/>
    <path d="M580 88L594 102L621 72" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g class="node n4"><circle cx="840" cy="86" r="42" fill="#1E6148"/>
    <rect x="824" y="66" width="32" height="40" rx="7" fill="none" stroke="#FFFFFF" stroke-width="4"/><circle cx="840" cy="98" r="3" fill="#FFFFFF"/></g>
  <g class="node n5"><circle cx="1080" cy="86" r="42" fill="#1E6148"/>
    <rect x="1062" y="66" width="36" height="42" rx="6" fill="#FFFFFF"/><rect x="1068" y="76" width="24" height="5" rx="2.5" fill="#1E6148"/><rect x="1068" y="87" width="16" height="5" rx="2.5" fill="#1E6148" opacity="0.5"/><path d="M1070 98L1075 103L1086 93" fill="none" stroke="#1E6148" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>

  <g class="t" text-anchor="middle">
    <text x="120" y="164" font-size="22" font-weight="700" fill="#111111">Scan</text>
    <text x="120" y="190" font-size="15" fill="#6B7280">Photo of a document</text>
    <text x="360" y="164" font-size="22" font-weight="700" fill="#111111">Read</text>
    <text x="360" y="190" font-size="15" fill="#6B7280">OCR runs on your phone</text>
    <text x="600" y="164" font-size="22" font-weight="700" fill="#111111">Verify</text>
    <text x="600" y="190" font-size="15" fill="#6B7280">Checksum and format checks</text>
    <text x="840" y="164" font-size="22" font-weight="700" fill="#111111">Save</text>
    <text x="840" y="190" font-size="15" fill="#6B7280">Stored in a local database</text>
    <text x="1080" y="164" font-size="22" font-weight="700" fill="#111111">Fill</text>
    <text x="1080" y="190" font-size="15" fill="#6B7280">Match fields in any form</text>
  </g>
</svg>
