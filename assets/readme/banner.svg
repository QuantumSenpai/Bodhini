<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bodhini, scan once and fill forms faster" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bodhini</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6148"/>
      <stop offset="1" stop-color="#123C2C"/>
    </linearGradient>
    <clipPath id="doc">
      <path transform="translate(150 75) scale(0.8) translate(-140 -104)" d="M168 104H290L364 178V388A28 28 0 0 1 336 416H168A28 28 0 0 1 140 388V132A28 28 0 0 1 168 104Z"/>
    </clipPath>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>
  <style>
    .float { animation: float 3.6s ease-in-out infinite; }
    .scan { opacity: 0; animation: scan 2.8s ease-in-out infinite; }
    .tick { stroke-dasharray: 120; stroke-dashoffset: 0; animation: draw 2.8s ease-in-out infinite; }
    .line { opacity: 0; animation: cycle 9s infinite both; }
    .l1 { opacity: 1; }
    .l2 { animation-delay: 3s; }
    .l3 { animation-delay: 6s; }
    .chip { animation: rise 0.9s ease-out both; }
    .c2 { animation-delay: 0.15s; }
    .c3 { animation-delay: 0.3s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes scan { 0% { transform: translateY(-20px); opacity: 0; } 12% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translateY(250px); opacity: 0; } }
    @keyframes draw { 0%,45% { stroke-dashoffset: 120; } 70%,100% { stroke-dashoffset: 0; } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(8px); } 5% { opacity: 1; transform: translateY(0); } 30% { opacity: 1; transform: translateY(0); } 35% { opacity: 0; transform: translateY(-8px); } 100% { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .float, .scan, .tick, .line, .chip { animation: none; } .l2, .l3 { opacity: 0; } .l1 { opacity: 1; } .tick { stroke-dashoffset: 0; } .scan { opacity: 0; } }
  </style>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="28" fill="url(#dots)"/>
  <circle cx="1060" cy="70" r="150" fill="#2E8A66" opacity="0.18"/>
  <circle cx="1130" cy="360" r="110" fill="#2E8A66" opacity="0.14"/>

  <g class="float">
    <g transform="translate(150 75) scale(0.8) translate(-140 -104)">
      <path d="M168 104H290L364 178V388A28 28 0 0 1 336 416H168A28 28 0 0 1 140 388V132A28 28 0 0 1 168 104Z" fill="#FFFFFF"/>
      <path d="M290 104V150A28 28 0 0 0 318 178H364Z" fill="#CFE5DA"/>
      <rect x="176" y="226" width="112" height="18" rx="9" fill="#1E6148"/>
      <rect x="176" y="266" width="76" height="18" rx="9" fill="#1E6148" opacity="0.45"/>
      <path class="tick" d="M184 352L216 384L282 312" fill="none" stroke="#1E6148" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g clip-path="url(#doc)">
      <rect class="scan" x="140" y="75" width="200" height="6" rx="3" fill="#3DDC97"/>
    </g>
  </g>

  <text x="420" y="168" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="92" font-weight="700" fill="#FFFFFF" letter-spacing="-2">Bodhini</text>
  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" fill="#CFE5DA">
    <text class="line l1" x="424" y="226">Scan a document on your phone.</text>
    <text class="line l2" x="424" y="226">Your details stay on this device.</text>
    <text class="line l3" x="424" y="226">Fill forms in a few taps.</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="600">
    <g class="chip"><rect x="424" y="270" width="190" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/><text x="519" y="296" text-anchor="middle" fill="#FFFFFF">On-device OCR</text></g>
    <g class="chip c2"><rect x="630" y="270" width="210" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/><text x="735" y="296" text-anchor="middle" fill="#FFFFFF">Aadhaar checksum</text></g>
    <g class="chip c3"><rect x="856" y="270" width="170" height="40" rx="20" fill="#FFFFFF" opacity="0.14"/><text x="941" y="296" text-anchor="middle" fill="#FFFFFF">Local storage</text></g>
  </g>
  <text x="424" y="362" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#8FBFA8">Made by Team NexBytes</text>
</svg>
